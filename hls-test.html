<!DOCTYPE html><html><head><meta charset="utf-8"><title>HLS TEST RUNNING</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>body{font-family:monospace;background:#111;color:#eee}td,th{border:1px solid #444;padding:4px 8px}.ok{color:#4caf50}.fail{color:#f44336}.twin{color:#ffc107}</style></head>
<body><h2 id="sum">RUNNING...</h2><table id="t"><tr><th>#</th><th>Channel</th><th>Result</th><th>Detail</th></tr></table>
<script>
const CH=[{"n": "BBC News (Akamai)", "u": "https://vs-cmaf-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/playlist.m3u8"}, {"n": "BBC News (South Asia)", "u": "https://mumbai-edge.smartplaytv.in/BBCNews/index.m3u8"}, {"n": "Euronews English HD", "u": "https://dash4.antik.sk/live/test_euronews/playlist.m3u8"}, {"n": "ABC News (DMD)", "u": "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8"}, {"n": "Trace Urban Intl HD", "u": "https://channels.trace.plus/Traceprod/URBAN_INTER_hd/index.m3u8"}, {"n": "9X Jalwa", "u": "https://wiselp.wiseplayout.com/9X_Jalwa/master.m3u8"}, {"n": "B4U Kadak", "u": "https://streams.tangotv.in/B4UKADAK/ORIGIN/index.m3u8"}, {"n": "Sony SAB", "u": "https://drk6xq0vhn.gpcdn.net/live/sub_hd_abr/index.m3u8"}, {"n": "&TV International", "u": "https://amg01117-amg01117c1-amgplt0029.playout.now3.amagi.tv/playlist/amg01117-amg01117c1-amgplt0029/playlist.m3u8"}, {"n": "Kartoon Channel", "u": "https://lightning-fnf-samsungaus.amagi.tv/playlist.m3u8"}, {"n": "pocket.watch", "u": "https://dl74gpgmnb7i8.cloudfront.net/pocketwatch_GameOn.m3u8"}];
const table=document.getElementById('t'); let done=0, okCount=0;
CH.forEach((c,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+(i+1)+'</td><td>'+c.n+'</td><td id="s'+i+'">queued</td><td id="d'+i+'"></td>';table.appendChild(tr);});
function setR(i,txt,cls,detail){const s=document.getElementById('s'+i);s.textContent=txt;s.className=cls;document.getElementById('d'+i).textContent=detail||'';}
function testOne(c,i,cb){
  function attempt(u,isTwin){
    const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.style.display='none'; document.body.appendChild(v);
    let finished=false, h=null;
    const to=setTimeout(()=>fin('timeout'),13000);
    function fin(res){
      if(finished) return; finished=true; clearTimeout(to);
      if(h){try{h.destroy();}catch(e){}}
      v.remove();
      if(res==='ok'){ okCount++; setR(i, isTwin?'OK-TWIN':'OK', isTwin?'twin':'ok',''); done++; upd(); cb(); }
      else if(!isTwin && u.indexOf('http://')===0){ attempt('https://'+u.slice(7), true); }
      else { setR(i,'FAIL','fail',res); done++; upd(); cb(); }
    }
    v.addEventListener('playing',()=>fin('ok'));
    if(Hls.isSupported()){
      h=new Hls({maxBufferLength:5});
      h.loadSource(u); h.attachMedia(v);
      h.on(Hls.Events.ERROR,(ev,data)=>{ if(data&&data.fatal) fin('hls:'+data.details); });
      const p=v.play(); if(p)p.catch(()=>{});
    } else if(v.canPlayType('application/vnd.apple.mpegurl')){
      v.src=u; const p=v.play(); if(p)p.catch(()=>{});
    } else fin('unsupported');
  }
  attempt(c.u,false);
}
function upd(){document.getElementById('sum').textContent='RUNNING '+done+'/'+CH.length+' (OK '+okCount+')';}
let idx=0; const BATCH=5;
function next(){
  if(idx>=CH.length){ document.getElementById('sum').textContent='DONE total='+CH.length+' OK='+okCount; document.title='DONE '+okCount+'/'+CH.length; return; }
  let pending=0;
  for(let k=0;k<BATCH&&idx<CH.length;k++){ const i=idx++; pending++; setR(i,'testing...','',''); testOne(CH[i],i,()=>{ pending--; if(pending===0) next(); }); }
}
next();
</script></body></html>
